name: "cltobadminton-preprod"

services:
  ## FRONTEND REACT ##
  frontend:
    container_name: cltobadminton-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_STRAPI_URL: https://admin.preprod.cltobadminton.fr

    restart: unless-stopped

    labels:
      - "traefik.enable=true"

      # Domaine frontend
      - "traefik.http.routers.cltobadminton-frontend.rule=Host(`preprod.cltobadminton.fr`)"
      - "traefik.http.routers.cltobadminton-frontend.entrypoints=websecure"

      # HTTPS
      - "traefik.http.routers.cltobadminton-frontend.tls=true"
      - "traefik.http.routers.cltobadminton-frontend.tls.certresolver=letsencrypt"

      # Port nginx interne
      - "traefik.http.services.cltobadminton-frontend.loadbalancer.server.port=80"

      # Basic Auth
      - "traefik.http.routers.cltobadminton-frontend.middlewares=preprod-auth@file"

      # Cache long /assets/ (fingerprintés)
      - "traefik.http.middlewares.clto-frontend-assets-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-frontend-assets.rule=Host(`preprod.cltobadminton.fr`) && PathPrefix(`/assets`)"
      - "traefik.http.routers.cltobadminton-frontend-assets.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-frontend-assets.tls=true"
      - "traefik.http.routers.cltobadminton-frontend-assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-frontend-assets.priority=100"
      - "traefik.http.routers.cltobadminton-frontend-assets.middlewares=clto-frontend-assets-cache,preprod-auth@file"
      - "traefik.http.routers.cltobadminton-frontend-assets.service=cltobadminton-frontend"

      # Cache long /fonts/
      - "traefik.http.middlewares.clto-frontend-fonts-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-frontend-fonts.rule=Host(`preprod.cltobadminton.fr`) && PathPrefix(`/fonts`)"
      - "traefik.http.routers.cltobadminton-frontend-fonts.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-frontend-fonts.tls=true"
      - "traefik.http.routers.cltobadminton-frontend-fonts.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-frontend-fonts.priority=100"
      - "traefik.http.routers.cltobadminton-frontend-fonts.middlewares=clto-frontend-fonts-cache,preprod-auth@file"
      - "traefik.http.routers.cltobadminton-frontend-fonts.service=cltobadminton-frontend"

    networks:
      - max_network
    # ports:
      # - "5173:80"

  ## STRAPI ##
  backend:
    container_name: cltobadminton-strapi

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    labels:
      - "traefik.enable=true"

      # Domaine API Strapi
      - "traefik.http.routers.cltobadminton-strapi.rule=Host(`admin.preprod.cltobadminton.fr`)"
      - "traefik.http.routers.cltobadminton-strapi.entrypoints=websecure"

      # HTTPS
      - "traefik.http.routers.cltobadminton-strapi.tls=true"
      - "traefik.http.routers.cltobadminton-strapi.tls.certresolver=letsencrypt"

      # Port Strapi interne
      - "traefik.http.services.cltobadminton-strapi.loadbalancer.server.port=1337"

      # Pas de Basic Auth ici : conflit avec les 401 de Strapi (boucle navigateur)
      # - "traefik.http.routers.cltobadminton-strapi.middlewares=preprod-auth@file"

      # Cache long /uploads/ uniquement (pas l’API JSON)
      - "traefik.http.middlewares.clto-strapi-uploads-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-strapi-uploads.rule=Host(`admin.preprod.cltobadminton.fr`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.cltobadminton-strapi-uploads.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-strapi-uploads.tls=true"
      - "traefik.http.routers.cltobadminton-strapi-uploads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-strapi-uploads.priority=100"
      - "traefik.http.routers.cltobadminton-strapi-uploads.middlewares=clto-strapi-uploads-cache"
      - "traefik.http.routers.cltobadminton-strapi-uploads.service=cltobadminton-strapi"

    networks:
      - max_network
    # ports:
      # - "1337:1337"

    volumes:
      - strapi_uploads:/backend/public/uploads

networks:
  max_network:
    external: true

volumes:
  strapi_uploads:
