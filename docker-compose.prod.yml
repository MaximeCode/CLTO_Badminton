name: "cltobadminton-prod"

services:
  ## FRONTEND REACT ##
  frontend:
    container_name: cltobadminton-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile

    restart: unless-stopped

    labels:
      - "traefik.enable=true"

      # Domaine frontend
      - "traefik.http.routers.cltobadminton-frontend-prod.rule=Host(`cltobadminton.fr`) || Host(`www.cltobadminton.fr`)"
      - "traefik.http.routers.cltobadminton-frontend-prod.entrypoints=websecure"

      # HTTPS
      - "traefik.http.routers.cltobadminton-frontend-prod.tls=true"
      - "traefik.http.routers.cltobadminton-frontend-prod.tls.certresolver=letsencrypt"

      # Port nginx interne
      - "traefik.http.services.cltobadminton-frontend-prod.loadbalancer.server.port=80"

      # Cache long /assets/ (JS/CSS fingerprintés) — TTL ≥ 30 jours (exigence PSI)
      - "traefik.http.middlewares.clto-frontend-assets-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.rule=(Host(`cltobadminton.fr`) || Host(`www.cltobadminton.fr`)) && PathPrefix(`/assets`)"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.tls=true"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.priority=100"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.middlewares=clto-frontend-assets-cache"
      - "traefik.http.routers.cltobadminton-frontend-prod-assets.service=cltobadminton-frontend-prod"

      # Cache long /fonts/ (woff2 auto-hébergées)
      - "traefik.http.middlewares.clto-frontend-fonts-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.rule=(Host(`cltobadminton.fr`) || Host(`www.cltobadminton.fr`)) && PathPrefix(`/fonts`)"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.tls=true"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.priority=100"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.middlewares=clto-frontend-fonts-cache"
      - "traefik.http.routers.cltobadminton-frontend-prod-fonts.service=cltobadminton-frontend-prod"

    networks:
      - max_network

  ## STRAPI ##
  backend:
    container_name: cltobadminton-strapi-prod

    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend/.env

    labels:
      - "traefik.enable=true"

      # Domaine API Strapi
      - "traefik.http.routers.cltobadminton-strapi-prod.rule=Host(`admin.cltobadminton.fr`)"
      - "traefik.http.routers.cltobadminton-strapi-prod.entrypoints=websecure"

      # HTTPS
      - "traefik.http.routers.cltobadminton-strapi-prod.tls=true"
      - "traefik.http.routers.cltobadminton-strapi-prod.tls.certresolver=letsencrypt"

      # Port Strapi interne
      - "traefik.http.services.cltobadminton-strapi-prod.loadbalancer.server.port=1337"

      # Cache long /uploads/ uniquement (pas l’API JSON)
      - "traefik.http.middlewares.clto-strapi-uploads-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.rule=Host(`admin.cltobadminton.fr`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.entrypoints=websecure"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.tls=true"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.priority=100"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.middlewares=clto-strapi-uploads-cache"
      - "traefik.http.routers.cltobadminton-strapi-prod-uploads.service=cltobadminton-strapi-prod"

    networks:
      - max_network

    volumes:
      - strapi_uploads-prod:/backend/public

networks:
  max_network:
    external: true

volumes:
  strapi_uploads-prod:
