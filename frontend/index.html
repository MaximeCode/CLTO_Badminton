<head>

  <link rel="preload" href="/fonts/bebas-neue-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <title>CLTO Badminton Orléans</title>
  <script>
    (function () {
      var host = location.hostname.toLowerCase();
      var prefix = "";
      if (
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "[::1]" ||
        host.slice(-6) === ".local" ||
        /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(host)
      ) {
        prefix = "DEV";
      } else if (host.indexOf("preprod") !== -1) {
        prefix = "PREPROD";
      }
      if (prefix) document.title = prefix + " " + document.title;
    })();
  </script>
  <meta name="description"
    content="CLTO Badminton Orléans : club de badminton à Orléans. Créneaux, inscriptions, interclubs, stages et vie du club." />
  <meta property="og:site_name" content="CLTO Badminton Orléans" />
  <meta property="og:title" content="CLTO Badminton Orléans" />

    content="CLTO Badminton Orléans : club de badminton à Orléans. Créneaux, inscriptions, interclubs, stages et vie du club." />

  <meta name="twitter:card" content="summary" />
  <meta name="robots" content="index, follow" />
  <!-- @lcp-hero -->

    /* Critical CSS — first paint avant le bundle Tailwind */

    body {
      height: 100%;
      margin: 0;

      font-family: "DM Sans", system-ui, sans-serif;

    #root {
      min-height: 100%;

      z-index: 1;

    /* Shell hero (aligné sur Hero.tsx état chargement) */

    @media (min-width: 1024px) {
      #lcp-hero-prerender {
        height: 65vh !important;
        min-height: 0 !important;
      }
    }
  </style>
</head>
