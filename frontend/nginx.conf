server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip (réduit le transfert JS/CSS/HTML)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        application/font-woff2;

    # Assets Vite fingerprintés → cache long
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts auto-hébergées
    location /fonts/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicons / manifest
    location ~* \.(ico|png|svg|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Ancien site PHP → nouvelles pages
    location ^~ /news/ {
        return 301 https://cltobadminton.fr/actualites;
    }
    
    location ^~ /news/news_controller/detailNews/1119 {
        return 301 https://cltobadminton.fr/actualite/g5objva6agvnzm6tp90ex358;
    }

    location ^~ /club/ {
        return 301 https://cltobadminton.fr;
    }

    location ^~ /jeunes/(jeunes_controller/espaceJeunes)?/?$ {
        return 301 https://cltobadminton.fr/jeunes;
    }

    # Redirect all /competitions/* and the specific espaceCompetiteur to the same destination
    location ~* ^/competitions(/competitions_controller/espaceCompetiteur)?/?$ {
        return 301 https://cltobadminton.fr/adultes-competiteurs;
    }

    location ^~ /jouer/jouer_controller/gymnase {
        return 301 https://cltobadminton.fr/gymnases;
    }

    location ^~ /jouer/jouer_controller/crenaux {
        return 301 https://cltobadminton.fr/crenaux;
    }

    location ^~ /jouer/ {
        return 301 https://cltobadminton.fr/crenaux;
    }

    location ^~ /contact {
        return 301 https://cltobadminton.fr/contact;
    }

    location = /entreprise {
        return 301 https://cltobadminton.fr/entreprises;
    }

    location = /entreprise/ {
        return 301 https://cltobadminton.fr/entreprises;
    }

    # llms.txt pour agents IA (Markdown statique, pas la SPA)
    location = /llms.txt {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA : HTML toujours revalidé
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
